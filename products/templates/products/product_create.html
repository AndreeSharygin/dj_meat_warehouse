{% extends "base.html" %}
{% block title %}Добавление товара{% endblock %}
{% block content %}
<h3>➕ Добавить товар на склад</h3>

<div class="card p-4 shadow-sm">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-warehouse">Добавить</button>
        <a href="{% url 'products:product_list' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
